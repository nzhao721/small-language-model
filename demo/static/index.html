<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OMR Demo</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <h1>Monophonic OMR demo</h1>
        <p class="lede">
          Upload a music excerpt. The Colab endpoint runs the fine-tuned Qwen2-VL-2B
          adapter; this machine renders a clean digital score from the predicted PrIMuS tokens.
        </p>
      </header>

      <section class="panel controls">
        <label class="field">
          <span>Colab base URL</span>
          <input
            id="colabUrl"
            type="url"
            placeholder="https://xxxx.ngrok-free.app"
            autocomplete="off"
            spellcheck="false"
          />
        </label>

        <div class="row">
          <label class="file-button">
            Choose image
            <input id="fileInput" type="file" accept="image/*" hidden />
          </label>
          <button id="runBtn" type="button" class="primary" disabled>Transcribe</button>
          <button id="healthBtn" type="button" class="ghost">Check Colab</button>
        </div>

        <p id="status" class="status" aria-live="polite">Select an image and paste the Colab URL.</p>
      </section>

      <section class="panel dropzone" id="dropzone">
        <p>Drop a score image here, or use Choose image.</p>
      </section>

      <section class="grid-two">
        <figure class="panel result">
          <figcaption>Uploaded excerpt</figcaption>
          <img id="inputPreview" alt="Uploaded score preview" hidden />
          <p id="inputEmpty" class="empty">No image yet.</p>
        </figure>
        <figure class="panel result">
          <figcaption>Rendered clean digital score</figcaption>
          <img id="renderPreview" alt="Rendered digital score" hidden />
          <p id="renderEmpty" class="empty">Waiting for transcription.</p>
        </figure>
      </section>

      <section class="panel">
        <div class="row between">
          <h2>Predicted PrIMuS semantic</h2>
          <button id="rerenderBtn" type="button" class="ghost" disabled>Re-render</button>
        </div>
        <textarea
          id="semantic"
          rows="5"
          placeholder="Semantic tokens will appear here after inference…"
          spellcheck="false"
        ></textarea>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
